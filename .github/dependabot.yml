version: 2
updates:
  # One combined PR per ecosystem per week. Ungrouped, a batch of bumps that
  # touch the same workflow file serialises behind branch protection and can
  # leave later PRs with conflicts Dependabot cannot rebase away.
  - package-ecosystem: "maven"
    directory: "/java-server"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot misreads the floating tag "maven:3-eclipse-temurin-NN" as a newer
      # version than the pinned "3.9.x-eclipse-temurin-26" and proposes a JDK downgrade
      # (e.g. #127: temurin 26 -> 24), which breaks the image build.
      - dependency-name: "maven"
        versions: ["3"]
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
