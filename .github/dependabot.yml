version: 2
updates:
  # One combined PR per ecosystem per week. Ungrouped, a batch of bumps that
  # touch the same workflow file serialises behind branch protection and can
  # leave later PRs with conflicts Dependabot cannot rebase away.
  - package-ecosystem: "maven"
    directory: "/java-server"
    schedule:
      interval: "weekly"
    groups:
      maven-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Dependabot treats the pinned JDK 26 tags as pre-releases because Docker Hub's
      # `latest` points at an older JDK line ("The `latest` tag points to the same image
      # as the `3` image, so dependabot is treating `3.9.15-eclipse-temurin-26` as a
      # pre-release"), then proposes floating-tag JDK downgrades such as
      # maven:3-eclipse-temurin-24 (#127/#130). Its Docker version class can't compare
      # those tags, so version-based ignores don't match. Bump these images by hand.
      - dependency-name: "maven"
      - dependency-name: "eclipse-temurin"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"
